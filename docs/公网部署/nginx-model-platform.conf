# 模型管理平台 · nginx 反向代理模板（公网用）
#
# 用法：
#   sudo cp docs/公网部署/nginx-model-platform.conf /etc/nginx/conf.d/model-platform.conf
#   sudo nano /etc/nginx/conf.d/model-platform.conf      # 把 ai.example.com 换成你的域名
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ai.example.com               # 自动签证书并改写本文件（加 443 段）
#
# ⚠️ 三个必须注意的点（下面都写好了，别删）：
#   1) client_max_body_size 512m —— 平台上传模型上限 500MB / 数据集 300MB，nginx 默认 1m 会直接 413；
#   2) proxy_read_timeout 1800s  —— **训练是同步接口**，一次训练可能几十分钟，默认 60s 会被掐断；
#   3) 安全响应头 —— 应用自身不输出这些头，必须由反代补。
#
# 应用自身监听 127.0.0.1:8080（由 start.sh 装成 systemd 服务），**不要**把 8080 对公网开放。

# 登录接口单独限速（抬高爆破成本；应用层没有失败锁定）
limit_req_zone $binary_remote_addr zone=mlogin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mapi:10m  rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;          # ← 改成你的域名

    # 只用于 certbot 校验；证书签好后 certbot 会自动加上 80→443 跳转
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.com;          # ← 改成你的域名

    # 证书（certbot --nginx 会自动填好；手工用 Let's Encrypt 时按实际路径改）
    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头（应用自身没有，必须在这里补）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- 上传与超时（见文件头说明）----
    client_max_body_size     512m;
    client_body_timeout      300s;
    proxy_connect_timeout    30s;
    proxy_send_timeout       1800s;
    proxy_read_timeout       1800s;
    proxy_request_buffering  off;        # 大文件边走边转，少占内存
    send_timeout             1800s;

    # 日志（配合 fail2ban 解析 POST /api/login/ 的 401/403）
    access_log /var/log/nginx/model-platform.access.log;
    error_log  /var/log/nginx/model-platform.error.log warn;

    # ---- 登录接口：更严格的限速 ----
    location = /api/login/ {
        limit_req zone=mlogin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params_model_platform.conf;
    }

    # ---- 其余接口与前端 ----
    location / {
        limit_req zone=mapi burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# 上面 location 里 include 的公共片段，放 /etc/nginx/proxy_params_model_platform.conf：
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
# （也可以直接把它删掉、把这几行抄进 location = /api/login/ 里）
